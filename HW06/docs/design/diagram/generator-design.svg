<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #17212b; }
      .title { font-size: 34px; font-weight: 700; fill: #17324d; }
      .group-title { font-size: 20px; font-weight: 700; fill: #526574; letter-spacing: 1px; }
      .node-title { font-size: 21px; font-weight: 700; }
      .node-text { font-size: 17px; }
      .edge-text { font-size: 16px; font-weight: 600; fill: #425466; }
      .small { font-size: 15px; fill: #526574; }
      .group { fill: #fffdea; stroke: #c7b94b; stroke-width: 2; rx: 16; }
      .input { fill: #e8f1ff; stroke: #2563eb; stroke-width: 2.5; rx: 12; }
      .stage { fill: #eefbf3; stroke: #16803c; stroke-width: 2.5; rx: 12; }
      .gate { fill: #fff7df; stroke: #b77900; stroke-width: 3; }
      .output { fill: #f3edff; stroke: #7545b5; stroke-width: 2.5; rx: 12; }
      .alert { fill: #fff0f0; stroke: #c24141; stroke-width: 2.5; rx: 12; }
      .edge { fill: none; stroke: #526574; stroke-width: 2.5; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #9a6700; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow-feedback); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#526574"/>
    </marker>
    <marker id="arrow-feedback" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#9a6700"/>
    </marker>
  </defs>

  <rect width="1800" height="1260" fill="#ffffff"/>
  <text x="900" y="50" text-anchor="middle" class="title">AI-DRIVEN API TEST GENERATOR</text>
  <text x="900" y="78" text-anchor="middle" class="small">Lê Phạm Kiều Duyên · 23127184 · Spec-derived oracles with mandatory human review</text>

  <rect x="45" y="105" width="1710" height="155" class="group"/>
  <text x="75" y="137" class="group-title">INPUTS</text>
  <rect x="85" y="160" width="430" height="70" class="input"/>
  <text x="300" y="191" text-anchor="middle" class="node-title">API specification</text>
  <text x="300" y="216" text-anchor="middle" class="node-text">Markdown contract</text>
  <rect x="685" y="160" width="430" height="70" class="input"/>
  <text x="900" y="191" text-anchor="middle" class="node-title">FR / SEC requirements</text>
  <text x="900" y="216" text-anchor="middle" class="node-text">Normative rule IDs</text>
  <rect x="1285" y="160" width="430" height="70" class="input"/>
  <text x="1500" y="191" text-anchor="middle" class="node-title">Target context</text>
  <text x="1500" y="216" text-anchor="middle" class="node-text">Endpoint + X-Student-Id: 23127184</text>

  <rect x="650" y="300" width="500" height="90" class="stage"/>
  <text x="900" y="334" text-anchor="middle" class="node-title">STAGE 1 · PARSE CONTRACT</text>
  <text x="900" y="362" text-anchor="middle" class="node-text">Normalize parameters, schema, rules and authentication</text>
  <path d="M300 230 C300 275,690 270,760 300" class="edge"/>
  <path d="M900 230 L900 300" class="edge"/>
  <path d="M1500 230 C1500 275,1110 270,1040 300" class="edge"/>
  <text x="650" y="280" class="edge-text">contract + rule IDs + identity</text>

  <text x="55" y="435" class="group-title">SEQUENTIAL COVERAGE PASSES</text>
  <rect x="45" y="460" width="300" height="105" class="stage"/>
  <text x="195" y="496" text-anchor="middle" class="node-title">STAGE 2 · DOMAIN</text>
  <text x="195" y="524" text-anchor="middle" class="node-text">Valid · invalid · boundary</text>
  <text x="195" y="548" text-anchor="middle" class="small">Adds CaseDraft[] partitions</text>
  <rect x="395" y="460" width="300" height="105" class="stage"/>
  <text x="545" y="496" text-anchor="middle" class="node-title">STAGE 3 · STATE</text>
  <text x="545" y="524" text-anchor="middle" class="node-text">Legal + full illegal matrix</text>
  <text x="545" y="548" text-anchor="middle" class="small">Adds transition cases</text>
  <rect x="745" y="460" width="300" height="105" class="stage"/>
  <text x="895" y="496" text-anchor="middle" class="node-title">STAGE 4 · SECURITY</text>
  <text x="895" y="524" text-anchor="middle" class="node-text">Anonymous · owner · other · admin</text>
  <text x="895" y="548" text-anchor="middle" class="small">Adds actor combinations</text>
  <rect x="1095" y="460" width="300" height="105" class="stage"/>
  <text x="1245" y="496" text-anchor="middle" class="node-title">STAGE 5 · SCHEMA</text>
  <text x="1245" y="524" text-anchor="middle" class="node-text">Types · required · invariants</text>
  <text x="1245" y="548" text-anchor="middle" class="small">Adds schema oracles</text>
  <polygon points="1570,445 1735,512 1570,579 1405,512" class="gate"/>
  <text x="1570" y="494" text-anchor="middle" class="node-title">STAGE 6 · STATIC</text>
  <text x="1570" y="520" text-anchor="middle" class="node-text">IDs · rules · setup · oracle</text>
  <text x="1570" y="544" text-anchor="middle" class="small">duplicates + mandatory header</text>
  <path d="M900 390 C900 425,195 420,195 460" class="edge"/>
  <text x="470" y="416" class="edge-text">EndpointModel</text>
  <path d="M345 512 L395 512" class="edge"/>
  <path d="M695 512 L745 512" class="edge"/>
  <path d="M1045 512 L1095 512" class="edge"/>
  <path d="M1395 512 L1405 512" class="edge"/>

  <polygon points="280,650 480,725 280,800 80,725" class="gate"/>
  <text x="280" y="696" text-anchor="middle" class="node-title">STAGE 7 · HUMAN REVIEW</text>
  <text x="280" y="724" text-anchor="middle" class="node-text">VALID / INVALID / INCOMPLETE</text>
  <text x="280" y="750" text-anchor="middle" class="small">reason + correction required</text>
  <rect x="580" y="675" width="310" height="100" class="output"/>
  <text x="735" y="715" text-anchor="middle" class="node-title">ApprovedCases</text>
  <text x="735" y="744" text-anchor="middle" class="node-text">Canonical case set</text>
  <rect x="1010" y="675" width="420" height="100" class="stage"/>
  <text x="1220" y="715" text-anchor="middle" class="node-title">RENDERERS</text>
  <text x="1220" y="744" text-anchor="middle" class="node-text">Inject + assert X-Student-Id: 23127184</text>
  <path d="M1570 579 C1570 625,280 605,280 650" class="edge"/>
  <text x="920" y="620" class="edge-text">pass → ReviewQueue</text>
  <path d="M480 725 L580 725" class="edge"/>
  <text x="500" y="710" class="edge-text">VALID / corrected</text>
  <path d="M890 725 L1010 725" class="edge"/>

  <rect x="60" y="845" width="1180" height="150" class="group"/>
  <text x="90" y="877" class="group-title">OUTPUT ARTEFACTS</text>
  <rect x="90" y="900" width="250" height="62" class="output"/>
  <text x="215" y="939" text-anchor="middle" class="node-title">Postman collections</text>
  <rect x="375" y="900" width="250" height="62" class="output"/>
  <text x="500" y="939" text-anchor="middle" class="node-title">JSON exports</text>
  <rect x="660" y="900" width="250" height="62" class="output"/>
  <text x="785" y="939" text-anchor="middle" class="node-title">Excel review table</text>
  <rect x="945" y="900" width="260" height="62" class="output"/>
  <text x="1075" y="925" text-anchor="middle" class="node-title">Coverage + phase</text>
  <text x="1075" y="949" text-anchor="middle" class="node-text">documents</text>
  <path d="M1220 775 L1220 820 L215 820 L215 900" class="edge"/>
  <path d="M1220 775 L1220 820 L500 820 L500 900" class="edge"/>
  <path d="M1220 775 L1220 820 L785 820 L785 900" class="edge"/>
  <path d="M1220 775 L1220 900 L1075 900" class="edge"/>

  <polygon points="410,1050 570,1120 410,1190 250,1120" class="gate"/>
  <text x="410" y="1097" text-anchor="middle" class="node-title">DRY RUN</text>
  <text x="410" y="1125" text-anchor="middle" class="node-text">Fresh seeded SUT</text>
  <text x="410" y="1151" text-anchor="middle" class="small">reachability + determinism</text>
  <rect x="700" y="1075" width="300" height="90" class="output"/>
  <text x="850" y="1116" text-anchor="middle" class="node-title">Verified test package</text>
  <text x="850" y="1144" text-anchor="middle" class="node-text">Ready for execution</text>
  <rect x="1085" y="1075" width="330" height="90" class="alert"/>
  <text x="1250" y="1116" text-anchor="middle" class="node-title">Bug triage</text>
  <text x="1250" y="1144" text-anchor="middle" class="node-text">Keep spec-derived oracle</text>
  <path d="M215 962 C215 1020,410 1000,410 1050" class="edge"/>
  <text x="230" y="1022" class="edge-text">executable collection</text>
  <path d="M570 1120 L700 1120" class="edge"/>
  <text x="615" y="1103" class="edge-text">pass</text>
  <path d="M570 1140 C760 1225,1060 1205,1085 1140" class="edge"/>
  <text x="790" y="1212" class="edge-text">runtime mismatch</text>

  <rect x="1500" y="850" width="260" height="150" class="alert"/>
  <text x="1630" y="890" text-anchor="middle" class="node-title">FEEDBACK ROUTER</text>
  <text x="1630" y="922" text-anchor="middle" class="node-text">Structural reject</text>
  <text x="1630" y="948" text-anchor="middle" class="node-text">INVALID / INCOMPLETE</text>
  <text x="1630" y="978" text-anchor="middle" class="small">stage + reason</text>
  <path d="M1570 579 L1570 850" class="feedback"/>
  <path d="M280 800 C280 830,1450 810,1500 885" class="feedback"/>
  <path d="M410 1190 C600 1250,1630 1240,1630 1000" class="feedback"/>
  <path d="M1500 925 C1435 925,1770 625,1760 420 C1755 360,195 370,195 460" class="feedback"/>
  <text x="1410" y="405" class="edge-text">return to producing stage</text>

  <text x="1740" y="1235" text-anchor="end" class="small">Observed SUT responses are evidence, never the oracle.</text>
</svg>
